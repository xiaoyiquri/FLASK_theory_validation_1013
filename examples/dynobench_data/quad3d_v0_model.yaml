# Paper VII-A published dynamics; undocumented geometry/dt retained.
# distance_weights: [1. , .5, .2, .2 ]
distance_weights: [1., .5, .1, .05]
max_vel: 4
max_angular_vel: 8
max_acc: 25 # used for bounds on time
max_angular_acc: 20 # used for bounds on time
motor_control: false # actual DynoBench wrench mode, verified in src/quadrotor.cpp
m: 1.0
max_f: 1.5
arm_length: 0.046
t2t: 0.006 # thrust-to-torque ratio
J_v: [0.1, 0.1, 0.2]
dt: .01
size: [.25]
dynamics: quad3d

# Actual B0 = diag(m*g, 20, 20, 20). Physical torque bounds: +/-2 N m.
u_lb: [0.0, -0.1, -0.1, -0.1]
u_ub: [1.5, 0.1, 0.1, 0.1]
