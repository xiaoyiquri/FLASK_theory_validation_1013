{
  "robot": "quad2d",
  "n": 2,
  "r": 4,
  "robot_radius": 0.1,
  "sphere_cell_size": 0.2,
  "bounds": {
    "lower": [
      -10,
      -10,
      -4,
      -4,
      -2,
      -2,
      -2,
      -2
    ],
    "upper": [
      10,
      10,
      4,
      4,
      2,
      2,
      2,
      2
    ]
  },
  "dynobench": {
    "environment": "../dynobench_data/quad2d_hole.yaml",
    "model": "../dynobench_data/quad2d_v0_model.yaml"
  },
  "lifting": {
    "start": {
      "acceleration": [
        0,
        0
      ],
      "jerk": [
        0,
        0
      ]
    },
    "goal": {
      "acceleration": [
        0,
        0
      ],
      "jerk": [
        0,
        0
      ]
    }
  },
  "planner": {
    "type": "rrtconnect",
    "seed": 41,
    "iterations": 1000000,
    "max_nodes": 10000,
    "timeout": 3,
    "range": 1,
    "shortcut": true
  },
  "validation": {
    "step": 0.02,
    "max_samples": 20000,
    "simd": true,
    "continuous_sphere_collision": true,
    "enforce_physical_continuity": true
  },
  "experiment_note": "Same seed, geometry and 3-second wall-time cap; higher iteration cap avoids premature 0.05-0.3s termination. Not paper defaults."
}
